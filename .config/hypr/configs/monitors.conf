################
### MONITORS ###
################
# See https://wiki.hypr.land/Configuring/Monitors/
# Superseded by monitors.lua — Hyprland 0.55+ reads the Lua config.

monitor=,preferred,auto,1

# Monitor descriptors are hardware identifiers and are not committed to this
# public repo. Run `hyprctl monitors` and substitute the real desc: strings.
#monitor=desc:<laptop panel>,preferred,0x0,1
#monitor=desc:<ultrawide>,preferred,1920x0,1
#monitor=desc:<side monitor>,1600x900,4480x180,1
#monitor=desc:<tv>,1920x1080@120,0x-1080,1,bitdepth,10

#workspace=1,desc:<laptop panel>,default:true
#workspace=2,desc:<ultrawide>,default:true
#workspace=7,desc:<side monitor>,default:true
#workspace=6,desc:<tv>,default:true
